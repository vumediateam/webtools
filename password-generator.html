<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
            text-align: center;
        }

        .password-box {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .password-content {
            flex: 1;
            text-align: left;
        }

        .password-label {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .password-display {
            font-size: 24px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            word-break: break-all;
            line-height: 1.4;
        }

        .copy-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            white-space: nowrap;
            font-size: 12px;
        }

        .copy-btn:hover {
            background: white;
            color: #10b981;
        }

        .copy-btn.copied {
            background: white;
            color: #10b981;
        }

        .options {
            margin-bottom: 25px;
            padding: 20px;
            background: #f9fafb;
            border-radius: 10px;
        }

        .option-group {
            margin-bottom: 20px;
        }

        .option-group:last-child {
            margin-bottom: 0;
        }

        .option-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .slider {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #d1d5db;
            outline: none;
            -webkit-appearance: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .slider::-webkit-slider-thumb:hover {
            background: #5568d3;
        }

        .slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
            transition: background 0.3s ease;
        }

        .slider::-moz-range-thumb:hover {
            background: #5568d3;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .checkbox-item label {
            cursor: pointer;
            color: #333;
            font-size: 14px;
            user-select: none;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .generate-btn {
            flex: 1;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s ease;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .generate-btn:active {
            transform: translateY(0);
        }

        .reset-btn {
            padding: 12px 20px;
            background: #e5e7eb;
            color: #333;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.3s ease;
        }

        .reset-btn:hover {
            background: #d1d5db;
        }

        .feedback {
            text-align: center;
            font-size: 12px;
            color: #10b981;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s ease;
            margin-top: 10px;
        }

        .feedback.show {
            opacity: 1;
        }

        .strength-meter {
            margin-top: 12px;
            height: 6px;
            background: #d1d5db;
            border-radius: 3px;
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0%;
            background: #ef4444;
            transition: width 0.3s ease, background 0.3s ease;
        }

        .strength-bar.weak {
            width: 33%;
            background: #ef4444;
        }

        .strength-bar.fair {
            width: 66%;
            background: #f59e0b;
        }

        .strength-bar.good {
            width: 100%;
            background: #10b981;
        }

        .strength-text {
            font-size: 12px;
            margin-top: 6px;
            color: #666;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" style="display: inline-block; margin-bottom: 20px; padding: 8px 16px; background: #667eea; color: white; text-decoration: none; border-radius: 6px; font-size: 14px; font-weight: 600; transition: background 0.3s ease;" onmouseover="this.style.background='#5568d3'" onmouseout="this.style.background='#667eea'">← Back to Dashboard</a>
        <h1>Password Generator</h1>
        <p class="subtitle">Create strong, secure passwords</p>

        <div class="password-box">
            <div class="password-content">
                <div class="password-label">Generated Password</div>
                <div class="password-display" id="passwordDisplay">Click Generate</div>
            </div>
            <button class="copy-btn" onclick="copyPassword()" id="copyBtn">Copy</button>
        </div>

        <div class="options">
            <div class="option-group">
                <div class="option-label">
                    <span>Password Length</span>
                    <span id="lengthValue">16</span>
                </div>
                <input type="range" id="passwordLength" class="slider" min="8" max="64" value="16" oninput="updateLength(this.value)">
            </div>

            <div class="option-group">
                <div class="option-label">Character Types</div>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="uppercase" checked onchange="updateSettings()">
                        <label for="uppercase">Uppercase Letters (A-Z)</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="lowercase" checked onchange="updateSettings()">
                        <label for="lowercase">Lowercase Letters (a-z)</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="numbers" checked onchange="updateSettings()">
                        <label for="numbers">Numbers (0-9)</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="symbols" checked onchange="updateSettings()">
                        <label for="symbols">Symbols (!@#$%^&*)</label>
                    </div>
                </div>
            </div>

            <div class="option-group">
                <div class="strength-meter">
                    <div class="strength-bar good" id="strengthBar"></div>
                </div>
                <div class="strength-text" id="strengthText">Very Strong</div>
            </div>
        </div>

        <div class="button-group">
            <button class="generate-btn" onclick="generatePassword()">Generate Password</button>
            <button class="reset-btn" onclick="resetSettings()">Reset</button>
        </div>

        <div class="feedback" id="feedback">✓ Copied to clipboard!</div>
    </div>

    <script>
        const passwordDisplay = document.getElementById('passwordDisplay');
        const uppercaseCheckbox = document.getElementById('uppercase');
        const lowercaseCheckbox = document.getElementById('lowercase');
        const numbersCheckbox = document.getElementById('numbers');
        const symbolsCheckbox = document.getElementById('symbols');
        const lengthSlider = document.getElementById('passwordLength');
        const feedback = document.getElementById('feedback');
        const copyBtn = document.getElementById('copyBtn');
        const strengthBar = document.getElementById('strengthBar');
        const strengthText = document.getElementById('strengthText');

        const charSets = {
            uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
            lowercase: 'abcdefghijklmnopqrstuvwxyz',
            numbers: '0123456789',
            symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
        };

        function generatePassword() {
            let availableChars = '';
            
            if (uppercaseCheckbox.checked) availableChars += charSets.uppercase;
            if (lowercaseCheckbox.checked) availableChars += charSets.lowercase;
            if (numbersCheckbox.checked) availableChars += charSets.numbers;
            if (symbolsCheckbox.checked) availableChars += charSets.symbols;

            if (availableChars === '') {
                alert('Please select at least one character type!');
                return;
            }

            const length = parseInt(lengthSlider.value);
            let password = '';

            for (let i = 0; i < length; i++) {
                password += availableChars.charAt(Math.floor(Math.random() * availableChars.length));
            }

            passwordDisplay.textContent = password;
            updateStrength(password);
            copyBtn.textContent = 'Copy';
            copyBtn.classList.remove('copied');
        }

        function updateLength(value) {
            document.getElementById('lengthValue').textContent = value;
        }

        function updateSettings() {
            generatePassword();
        }

        function updateStrength(password) {
            let strength = 0;
            
            // Length score
            if (password.length >= 8) strength += 20;
            if (password.length >= 16) strength += 20;
            if (password.length >= 32) strength += 20;

            // Character variety score
            if (/[A-Z]/.test(password)) strength += 15;
            if (/[a-z]/.test(password)) strength += 15;
            if (/[0-9]/.test(password)) strength += 15;
            if (/[^A-Za-z0-9]/.test(password)) strength += 10;

            // Update bar
            let barClass = 'weak';
            let text = 'Weak';

            if (strength >= 70) {
                barClass = 'good';
                text = 'Very Strong';
            } else if (strength >= 50) {
                barClass = 'fair';
                text = 'Fair';
            }

            strengthBar.className = `strength-bar ${barClass}`;
            strengthText.textContent = text;
        }

        function copyPassword() {
            const password = passwordDisplay.textContent;
            
            if (password === 'Click Generate') {
                alert('Please generate a password first!');
                return;
            }

            navigator.clipboard.writeText(password).then(() => {
                copyBtn.textContent = '✓ Copied!';
                copyBtn.classList.add('copied');
                
                feedback.classList.add('show');
                setTimeout(() => {
                    feedback.classList.remove('show');
                }, 2000);

                setTimeout(() => {
                    copyBtn.textContent = 'Copy';
                    copyBtn.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                alert('Failed to copy password');
                console.error(err);
            });
        }

        function resetSettings() {
            lengthSlider.value = 16;
            document.getElementById('lengthValue').textContent = '16';
            uppercaseCheckbox.checked = true;
            lowercaseCheckbox.checked = true;
            numbersCheckbox.checked = true;
            symbolsCheckbox.checked = true;
            passwordDisplay.textContent = 'Click Generate';
            copyBtn.textContent = 'Copy';
            copyBtn.classList.remove('copied');
            generatePassword();
        }

        // Generate password on load
        window.addEventListener('load', generatePassword);
    </script>
</body>
</html>
